# P3.2 E6b: E6a + attentive statistics pooling (CNN-BiLSTM-Att). LFCC, Phase 2 protocol; compare with E4a (v1 CNN-BiLSTM, same data).
name: e6b_crnn_seres_asp

model:
  name: crnn
  frontend:
    name: lfcc
  kwargs:
    n_feat: 60
    cnn: se_res
    rnn: lstm
    pooling: asp

audio:
  trim_silence: true

augment:                    # the augmentation selected in Phase 2 (E4a)
  rawboost: {p: 0.7, algos: [lnl, isd]}
  gain: {p: 0.5, min_db: -6, max_db: 6}

train:
  batch_size: 32
  eval_batch_size: 64
  lr: 1.0e-3
  max_epochs: 50
  early_stop_patience: 8
