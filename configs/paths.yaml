# Where datasets and generated data live on this machine.
# Relative paths are resolved against the repository root.
# To use other locations without editing this file, point the ADFD_PATHS
# environment variable at your own copy.

datasets:
  asvspoof2019_la: G:/ASVspoof2019-dataset          # main: train / dev / eval
  in_the_wild: G:/release_in_the_wild-dataset       # cross-dataset test only
  deep_voice: G:/DEEPVOICE-dataset/KAGGLE/AUDIO     # cross-dataset test only (REAL/, FAKE/)
  speech_dataset: "G:/audio db/Speech_Dataset"      # extra test only (REAL/, FAKE/; source not recorded)
  partialspoof: F:/PartialSpoof/database            # PartialSpoof v1.2: labels, protocols, vad, eval audio
  partialspoof_dev_audio: "F:/database_dev mixed/database/dev/con_wav"   # PartialSpoof dev audio

manifests_dir: data/manifests   # generated by scripts/build_manifests.py
cache_dir: .cache               # pip / Hugging Face / torch caches (kept off the small C: drive)
runs_dir: runs                  # checkpoints, logs, per-run scores
