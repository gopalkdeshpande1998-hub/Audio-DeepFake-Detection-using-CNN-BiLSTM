# E7b: the E7a model (WavLM-Base+ fine-tuned + CNN-BiLSTM-Att), retrained for ~6 h for
# real-world robustness (user decision, 2026-11-22):
#   - warm start from the E7a checkpoint (seed 42)
#   - training data: ASVspoof 2019 LA train + the In-the-Wild TRAIN speakers (speaker split
#     from scripts/build_extra_data.py; the In-the-Wild TEST speakers are never trained or tuned on)
#   - model selection: mean of ASVspoof dev EER (8,000-clip stratified subset per epoch) and
#     In-the-Wild dev EER (separate speakers)
#   - stronger augmentation than E7a: RawBoost + codec (MP3, Opus, telephone) + resampling + gain
# Budget: ~29 min per epoch on the RTX 3050 -> 10 epochs ~4.8 h, then ~50 min of test scoring.
name: e7b_wavlm_crnn_itw

model:
  name: crnn
  frontend:
    name: ssl
    model: wavlm_base_plus
    mode: finetune
    proj_dim: 128
    grad_checkpointing: true
  kwargs:
    n_feat: 128
    cnn: se_res
    rnn: lstm
    pooling: asp

audio:
  trim_silence: true

data:
  val_limit: 8000
  extra:
    - {manifest: in_the_wild_xd, cache: in_the_wild, train_split: train, val_split: dev}
  test_sets:
    - asvspoof2019_la:eval
    - in_the_wild_xd:test
    - deep_voice:test
    - speech_dataset:test

augment:
  rawboost: {p: 0.6, algos: [lnl, isd]}
  codec:    {p: 0.3, types: [mp3, opus, telephone]}
  resample: {p: 0.15, rates: [8000, 11025, 12000]}
  gain:     {p: 0.5, min_db: -6, max_db: 6}

train:
  init_from: runs/e7a_wavlm_crnn_s42/best.pt
  batch_size: 8
  grad_accum: 4             # effective batch 32
  eval_batch_size: 32
  lr: 1.0e-4                # back end
  ssl_lr: 1.0e-5            # pretrained transformer
  max_epochs: 10
  early_stop_patience: 4
