# P3.3 E7a: SSL-CNN-BiLSTM-Att. WavLM-Base+ (fine-tuned; CNN feature encoder frozen) ->
# learned weighted sum of its 13 hidden layers -> 128-d projection -> SE-residual CNN,
# BiLSTM, attentive statistics pooling (the E6b back end). Phase 2 protocol (trimmed, RawBoost).
# Budget-capped (about 7.7 h for 3 seeds incl. scoring on the RTX 3050): 3 epochs, cosine schedule.
name: e7a_wavlm_crnn

model:
  name: crnn
  frontend:
    name: ssl
    model: wavlm_base_plus
    mode: finetune
    proj_dim: 128
    grad_checkpointing: true
  kwargs:
    n_feat: 128
    cnn: se_res
    rnn: lstm
    pooling: asp

audio:
  trim_silence: true

augment:                    # the augmentation selected in Phase 2 (E4a)
  rawboost: {p: 0.7, algos: [lnl, isd]}
  gain: {p: 0.5, min_db: -6, max_db: 6}

train:
  batch_size: 8
  grad_accum: 4             # effective batch 32
  eval_batch_size: 32
  lr: 1.0e-4                # back end
  ssl_lr: 1.0e-5            # pretrained transformer
  max_epochs: 3
  early_stop_patience: 3
