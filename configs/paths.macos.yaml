# Paths for macOS (or Linux). Use it with:   export ADFD_PATHS=configs/paths.macos.yaml
# ~ and $VARS are expanded; relative paths start at the repository root.
# The app (streamlit run app.py) and the API only need runs/ (the trained checkpoints); the datasets are needed
# only for training, evaluation and the DEEP-VOICE demo clips. Missing dataset folders are fine for the app.

datasets:
  asvspoof2019_la: ~/datasets/ASVspoof2019-dataset
  in_the_wild: ~/datasets/release_in_the_wild-dataset
  deep_voice: ~/datasets/DEEPVOICE-dataset/KAGGLE/AUDIO
  speech_dataset: ~/datasets/Speech_Dataset
  partialspoof: ~/datasets/PartialSpoof/database
  partialspoof_dev_audio: ~/datasets/PartialSpoof/database/dev/con_wav

manifests_dir: data/manifests
cache_dir: .cache
runs_dir: runs
