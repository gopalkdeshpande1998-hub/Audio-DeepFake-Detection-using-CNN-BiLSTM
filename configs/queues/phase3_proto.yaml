# Phase 3 prototype (about 5 h, user decision 2026-11-21): seed 42 only, shortened schedules
# (E6b 15, RawNet2 12, WavLM 2, AASIST 3 epochs). LCNN s42 is already done (full schedule).
# The full 3-seed queues (phase3_p31_p32.yaml, phase3_p33_final.yaml) are kept for the later upgrade;
# these shortened runs must be deleted first, since the queue skips finished run folders.
- train:
    config: configs/experiments/e6b_crnn_seres_asp.yaml
    seed: 42
    max_epochs: 15
- evaluate:
    run: e6b_crnn_seres_asp_s42
- evaluate:
    run: e6b_crnn_seres_asp_s42
    tag: robustdev
    n_boot: 0
    sets:
    - asvspoof2019_la_robustdev_clean:test
    - asvspoof2019_la_robustdev_mp3_51k:test
    - asvspoof2019_la_robustdev_mp3_19k:test
