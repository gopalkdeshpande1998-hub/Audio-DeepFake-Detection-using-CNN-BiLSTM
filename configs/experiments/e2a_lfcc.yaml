# P2.1 feature ablation: same CNN-BiLSTM and training as E1, input = LFCC-60 (20 linear-frequency cepstra + deltas), 20 ms / 10 ms.
name: e2a_lfcc

model:
  name: cnn_bilstm
  frontend:
    name: lfcc

train:
  batch_size: 32
  eval_batch_size: 64
  lr: 1.0e-3
  max_epochs: 50
  early_stop_patience: 8
