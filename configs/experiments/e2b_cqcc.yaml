# P2.1 feature ablation: same CNN-BiLSTM and training as E1, input = CQCC-60 (constant-Q cepstra + deltas), 15 Hz-7.5 kHz, hop 16 ms.
name: e2b_cqcc

model:
  name: cnn_bilstm
  frontend:
    name: cqcc

train:
  batch_size: 32
  eval_batch_size: 64
  lr: 1.0e-3
  max_epochs: 50
  early_stop_patience: 8
