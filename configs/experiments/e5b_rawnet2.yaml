# P3.1 E5b: RawNet2 (raw waveform), the ASVspoof 2021 end-to-end baseline. Phase 2 protocol.
name: e5b_rawnet2

model:
  name: rawnet2
  frontend:
    name: raw

audio:
  trim_silence: true

augment:                    # the augmentation selected in Phase 2 (E4a)
  rawboost: {p: 0.7, algos: [lnl, isd]}
  gain: {p: 0.5, min_db: -6, max_db: 6}

train:
  batch_size: 32
  eval_batch_size: 64
  lr: 1.0e-4
  max_epochs: 50
  early_stop_patience: 8
