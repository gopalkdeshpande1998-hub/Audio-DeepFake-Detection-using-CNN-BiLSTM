[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "adfd"
version = "0.1.0"
description = "Audio deepfake detection: leak-free, cross-dataset research pipeline"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "datasets: needs the real datasets on disk (skipped when they are missing)",
]
